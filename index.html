<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪奇物语</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Stranger_Things_logo.png/1200px-Stranger_Things_logo.png') no-repeat center center fixed; /* 使用一个示例背景图，你可以替换它 */
            background-size: cover;
            color: #f5f5f5;
            text-align: center;
            line-height: 1.6;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.7); /* 半透明黑色覆盖层 */
            padding: 50px 20px;
            min-height: 100vh; /* 确保覆盖整个视口 */
            box-sizing: border-box;
        }

        h1 {
            font-size: 4em;
            color: #e50914; /* Netflix 红色 */
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            max-width: 800px;
            margin: 0 auto 30px auto;
            color: #ccc;
        }

        .character-image {
            width: 80%;
            max-width: 600px;
            border: 5px solid #e50914;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
            margin-top: 30px;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>怪奇物语</h1>
        <p>《怪奇物语》（Stranger Things）是一部由杜菲兄弟（Duffer Brothers）创作的美国科幻恐怖剧集，于2016年7月15日在Netflix首播。故事背景设定在1980年代的印第安纳州霍金斯小镇，讲述了一群孩子和成年人卷入一系列超自然事件和政府秘密实验的故事。</p>
        <p>剧集以其对80年代流行文化的致敬、引人入胜的剧情、紧张的氛围和出色的角色塑造而广受好评。</p>
        
        <img src="https://m.media-amazon.com/images/M/MV5BMGU5YmYwYTktMjdiNS00YjkzLWJlMzMtYzMyMmU2YTljMDQ0XkEyXkFqcGdeQXVyMzQwMTY2Nzk@._V1_.jpg" alt="怪奇物语主要角色" class="character-image">

        <p class="footer">本页面纯属示例，所有内容版权归Netflix所有。</p>
    </div>
</body>
</html>
